# Worker da API. Nada pessoal aqui: segredos e config vão por `npm run cf:secrets` (lê o .env).
# O Pages (frontend/wrangler.toml) repassa /api/* para cá por service binding: sem URL pública.
name = "kahuy-api"
main = "src/FrameworksAndDrivers/Entrypoints/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
