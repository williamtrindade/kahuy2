<text x="70" y="578.5" font-size="14" font-weight="700" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90 70 578.5) translate(0 -14)">Regra da Dependência: sempre para dentro</text>
<text x="170" y="1015" font-size="14" font-weight="700" fill="#1b1b1b">Fluxo de GET /api/progress/monthly</text>
<text x="170" y="1034" font-size="13" fill="#1b1b1b">1  HonoApp valida a sessão e chama o Controller</text>
<text x="170" y="1053" font-size="13" fill="#1b1b1b">2  Controller cria o RequestModel e o ApiPresenter</text>
<text x="170" y="1072" font-size="13" fill="#1b1b1b">3  Controller → InputBoundary.execute(requestModel, presenter)</text>
<text x="170" y="1091" font-size="13" fill="#1b1b1b">4  Interactor lê as tasks (TaskRepositoryInterface) e o calendário (WorkCalendarRepositoryInterface),</text>
<text x="170" y="1110" font-size="13" fill="#1b1b1b">   calcula mês e hoje (Entregue/Previsto) com as Entities; a semana tem rota própria (/weekly)</text>
<text x="170" y="1129" font-size="13" fill="#1b1b1b">5  Interactor → presenter.present(responseModel) via OutputBoundary</text>
<text x="170" y="1148" font-size="13" fill="#1b1b1b">6  Controller devolve presenter.getViewModel() como JSON</text>
<line x1="1150" y1="1011" x2="1200" y2="1011" stroke="#1fa64a" stroke-width="1.8" marker-end="url(#arrowG)"/>
